<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0F172A"/>
      <stop offset="100%" stop-color="#1E293B"/>
    </linearGradient>
    <linearGradient id="card-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#334155"/>
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0D9488"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="900" height="480" rx="12" fill="url(#bg)"/>

  <!-- Top Bar -->
  <rect x="0" y="0" width="900" height="56" rx="12" fill="#0F172A"/>
  <rect x="0" y="44" width="900" height="12" fill="#0F172A"/>
  <circle cx="32" cy="28" r="6" fill="#EF4444"/>
  <circle cx="52" cy="28" r="6" fill="#F59E0B"/>
  <circle cx="72" cy="28" r="6" fill="#10B981"/>
  
  <text x="100" y="34" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="14" font-weight="500">Kit Docente con IA · Hub Interactivo de Estudio</text>
  
  <!-- Pill badge -->
  <rect x="760" y="16" width="108" height="24" rx="12" fill="#0D9488" opacity="0.2"/>
  <text x="814" y="32" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">v1.0.0 STABLE</text>

  <!-- Hero Header Inside Preview -->
  <rect x="40" y="80" width="820" height="90" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <text x="70" y="115" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="12" font-weight="600" letter-spacing="1">3º ESO · FÍSICA Y QUÍMICA</text>
  <text x="70" y="145" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="22" font-weight="700">El Átomo y la Materia</text>
  <rect x="730" y="108" width="100" height="34" rx="6" fill="#2563EB"/>
  <text x="780" y="130" fill="#FFFFFF" font-family="system-ui, sans-serif" font-size="12" font-weight="600" text-anchor="middle">Estudiar ➔</text>

  <!-- Grid of Cards (6 Study Modes / Units) -->
  <!-- Card 1 -->
  <rect x="40" y="190" width="256" height="120" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <circle cx="68" cy="225" r="16" fill="#0D9488" opacity="0.2"/>
  <text x="68" y="230" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">1</text>
  <text x="96" y="222" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Estados de la Materia</text>
  <text x="96" y="242" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Teoría cinético-molecular</text>
  <!-- Progress bar -->
  <rect x="68" y="272" width="200" height="6" rx="3" fill="#334155"/>
  <rect x="68" y="272" width="140" height="6" rx="3" fill="#0D9488"/>
  <text x="230" y="266" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="10" font-weight="600">70%</text>

  <!-- Card 2 -->
  <rect x="322" y="190" width="256" height="120" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <circle cx="350" cy="225" r="16" fill="#2563EB" opacity="0.2"/>
  <text x="350" y="230" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">2</text>
  <text x="378" y="222" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Estructura Atómica</text>
  <text x="378" y="242" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Modelos de Bohr y Rutherford</text>
  <!-- Progress bar -->
  <rect x="350" y="272" width="200" height="6" rx="3" fill="#334155"/>
  <rect x="350" y="272" width="80" height="6" rx="3" fill="#2563EB"/>
  <text x="512" y="266" fill="#60A5FA" font-family="system-ui, sans-serif" font-size="10" font-weight="600">40%</text>

  <!-- Card 3 -->
  <rect x="604" y="190" width="256" height="120" rx="8" fill="url(#card-grad)" stroke="#334155" stroke-width="1"/>
  <circle cx="632" cy="225" r="16" fill="#9333EA" opacity="0.2"/>
  <text x="632" y="230" fill="#C084FC" font-family="system-ui, sans-serif" font-size="14" font-weight="700" text-anchor="middle">3</text>
  <text x="660" y="222" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="14" font-weight="600">Sistema Periódico</text>
  <text x="660" y="242" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="12">Grupos, periodos e iones</text>
  <!-- Progress bar -->
  <rect x="632" y="272" width="200" height="6" rx="3" fill="#334155"/>
  <rect x="632" y="272" width="200" height="6" rx="3" fill="#9333EA"/>
  <text x="794" y="266" fill="#C084FC" font-family="system-ui, sans-serif" font-size="10" font-weight="600">100%</text>

  <!-- Bottom Banner: Modes & Tools -->
  <rect x="40" y="330" width="820" height="110" rx="8" fill="#1E293B" stroke="#334155" stroke-width="1"/>
  <text x="70" y="360" fill="#F8FAFC" font-family="system-ui, sans-serif" font-size="15" font-weight="700">6 Modos Interactivos Integrados en el Motor Web</text>
  
  <g transform="translate(70, 375)">
    <!-- Badge 1 -->
    <rect x="0" y="0" width="90" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="45" y="18" fill="#38BDF8" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Test (MC/VF)</text>
    
    <!-- Badge 2 -->
    <rect x="100" y="0" width="90" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="145" y="18" fill="#2DD4BF" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Tarjetas</text>
    
    <!-- Badge 3 -->
    <rect x="200" y="0" width="90" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="245" y="18" fill="#C084FC" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Escribir</text>
    
    <!-- Badge 4 -->
    <rect x="300" y="0" width="90" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="345" y="18" fill="#F43F5E" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Clasificar</text>

    <!-- Badge 5 -->
    <rect x="400" y="0" width="90" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="445" y="18" fill="#F59E0B" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Examen</text>

    <!-- Badge 6 -->
    <rect x="500" y="0" width="100" height="28" rx="6" fill="#0F172A" stroke="#334155"/>
    <text x="550" y="18" fill="#10B981" font-family="system-ui, sans-serif" font-size="11" font-weight="600" text-anchor="middle">Test Rápido</text>
  </g>
  <text x="710" y="394" fill="#94A3B8" font-family="system-ui, sans-serif" font-size="11">Privacidad 100% local</text>
</svg>
