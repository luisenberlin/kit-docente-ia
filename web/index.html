<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="robots" content="noindex, nofollow">
  <title>Recursos de Estudio · Kit Docente con IA</title>
  <script>
    (function() {
      try {
        var theme = localStorage.getItem('docente:theme') || localStorage.getItem('luislab:theme') || 'auto';
        var root = document.documentElement;
        if (theme === 'dark' || (theme === 'auto' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
          root.setAttribute('data-theme', 'dark');
        } else {
          root.setAttribute('data-theme', 'light');
        }
      } catch (e) {}
    })();
  </script>
  <link rel="stylesheet" href="shared/styles/tokens.css">
  <link rel="stylesheet" href="shared/styles/base.css">
  <link rel="stylesheet" href="shared/styles/components.css">
  <style>
    .hub-container {
      max-width: 1040px;
      margin: 0 auto;
      padding: var(--space-8) var(--space-4);
    }
    .hub-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: var(--space-8);
      border-bottom: 1px solid var(--border-color);
      padding-bottom: var(--space-4);
    }
    .hub-title h1 {
      font-size: var(--text-3xl);
      font-weight: 700;
      margin: 0;
      letter-spacing: -0.02em;
    }
    .hub-title p {
      color: var(--text-muted);
      margin: var(--space-1) 0 0;
      font-size: var(--text-base);
    }
    .hub-controls {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-3);
      margin-bottom: var(--space-6);
      align-items: center;
      justify-content: space-between;
    }
    .search-input {
      padding: var(--space-2) var(--space-3);
      border-radius: var(--radius-md);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-main);
      font-size: var(--text-sm);
      min-width: 240px;
    }
    .filter-tags {
      display: flex;
      flex-wrap: wrap;
      gap: var(--space-2);
    }
    .filter-btn {
      padding: var(--space-1) var(--space-3);
      border-radius: var(--radius-full);
      border: 1px solid var(--border-color);
      background: var(--bg-card);
      color: var(--text-muted);
      font-size: var(--text-xs);
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .filter-btn.active, .filter-btn:hover {
      background: var(--color-primary);
      color: white;
      border-color: var(--color-primary);
    }
    .grid-recursos {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
      gap: var(--space-4);
    }
    .card-recurso {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: var(--space-5);
      text-decoration: none;
      color: inherit;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: transform 0.15s ease, box-shadow 0.15s ease, border-color 0.15s ease;
      position: relative;
      overflow: hidden;
    }
    .card-recurso:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 24px rgba(0,0,0,0.06);
      border-color: var(--color-primary);
    }
    .card-accent-bar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 4px;
    }
    .card-meta {
      display: flex;
      align-items: center;
      gap: var(--space-2);
      margin-bottom: var(--space-2);
    }
    .card-tag {
      font-size: var(--text-xs);
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 8px;
      border-radius: var(--radius-sm);
      background: var(--bg-muted);
    }
    .card-course {
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .card-title {
      font-size: var(--text-lg);
      font-weight: 600;
      margin: 0 0 var(--space-2);
      line-height: 1.3;
    }
    .card-desc {
      font-size: var(--text-sm);
      color: var(--text-muted);
      margin: 0;
      flex-grow: 1;
    }
    .card-footer {
      margin-top: var(--space-4);
      padding-top: var(--space-3);
      border-top: 1px solid var(--border-color);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: var(--text-xs);
      color: var(--text-muted);
    }
    .empty-state {
      text-align: center;
      padding: var(--space-12) var(--space-4);
      background: var(--bg-card);
      border: 1px dashed var(--border-color);
      border-radius: var(--radius-xl);
      grid-column: 1 / -1;
    }
    .empty-state h3 {
      font-size: var(--text-xl);
      margin-bottom: var(--space-2);
    }
    .empty-state p {
      color: var(--text-muted);
      max-width: 480px;
      margin: 0 auto var(--space-4);
    }
    .code-pill {
      background: var(--bg-muted);
      padding: var(--space-1) var(--space-2);
      border-radius: var(--radius-sm);
      font-family: monospace;
      font-size: var(--text-xs);
    }
  </style>
</head>
<body>
  <div class="hub-container">
    <header class="hub-header">
      <div class="hub-title">
        <h1>Recursos de Estudio Interactivos</h1>
        <p>Actividades interactivas generadas con IA (test, tarjetas, retos y examen)</p>
      </div>
      <button id="theme-toggle" class="themebtn" type="button" aria-label="Cambiar tema">
        <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true">
          <circle cx="12" cy="12" r="4"/>
          <path d="M12 2v2M12 20v2M4.93 4.93l1.41 1.41M17.66 17.66l1.41 1.41M2 12h2M20 12h2M4.93 19.07l1.41-1.41M17.66 6.34l1.41-1.41"/>
        </svg>
        <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8Z"/>
        </svg>
      </button>
    </header>

    <div class="hub-controls">
      <input type="search" id="search-box" class="search-input" placeholder="Buscar por tema o concepto..." aria-label="Buscar recursos">
      <div class="filter-tags" id="subject-filters">
        <button class="filter-btn active" data-subject="all">Todas</button>
      </div>
    </div>

    <main class="grid-recursos" id="recursos-grid">
      <!-- Se rellenará dinámicamente desde recursos.json -->
    </main>
  </div>

  <script src="shared/scripts/theme.js"></script>
  <script>
    (function() {
      var allRecursos = [];
      var activeFilter = 'all';
      var searchQuery = '';

      var grid = document.getElementById('recursos-grid');
      var filtersContainer = document.getElementById('subject-filters');
      var searchBox = document.getElementById('search-box');

      function render(items) {
        if (!items || items.length === 0) {
          grid.innerHTML = '<div class="empty-state">' +
            '<h3>No hay recursos disponibles</h3>' +
            '<p>Crea el primer recurso ejecutando <span class="code-pill">/crear-recurso</span> en tu asistente y adjuntando los apuntes.</p>' +
            '</div>';
          return;
        }

        grid.innerHTML = items.map(function(r) {
          var color = r.color || '#2563eb';
          return '<a href="contenidos/' + r.slug + '.html" class="card-recurso">' +
            '<div class="card-accent-bar" style="background:' + color + '"></div>' +
            '<div class="card-meta">' +
              '<span class="card-tag" style="color:' + color + '">' + (r.subject || 'General') + '</span>' +
              (r.course ? '<span class="card-course">' + r.course + '</span>' : '') +
            '</div>' +
            '<h2 class="card-title">' + (r.title || r.slug) + '</h2>' +
            '<p class="card-desc">' + (r.description || 'Práctica interactiva con 6 modos de estudio.') + '</p>' +
            '<div class="card-footer">' +
              '<span>' + (r.stats || '6 modos') + '</span>' +
              '<span>Acceder →</span>' +
            '</div>' +
          '</a>';
        }).join('');
      }

      function updateFilters() {
        var filtered = allRecursos.filter(function(r) {
          var matchesSubject = activeFilter === 'all' || (r.subject && r.subject.toLowerCase() === activeFilter.toLowerCase());
          var q = searchQuery.toLowerCase();
          var matchesSearch = !q ||
            (r.title && r.title.toLowerCase().indexOf(q) !== -1) ||
            (r.subject && r.subject.toLowerCase().indexOf(q) !== -1) ||
            (r.description && r.description.toLowerCase().indexOf(q) !== -1);
          return matchesSubject && matchesSearch;
        });
        render(filtered);
      }

      function buildFilterButtons(items) {
        var subjects = {};
        items.forEach(function(i) {
          if (i.subject) subjects[i.subject] = true;
        });
        var list = Object.keys(subjects);
        if (list.length === 0) return;

        filtersContainer.innerHTML = '<button class="filter-btn active" data-subject="all">Todas</button>' +
          list.map(function(s) {
            return '<button class="filter-btn" data-subject="' + s + '">' + s + '</button>';
          }).join('');

        filtersContainer.querySelectorAll('.filter-btn').forEach(function(btn) {
          btn.addEventListener('click', function() {
            filtersContainer.querySelectorAll('.filter-btn').forEach(function(b) { b.classList.remove('active'); });
            btn.classList.add('active');
            activeFilter = btn.getAttribute('data-subject');
            updateFilters();
          });
        });
      }

      searchBox.addEventListener('input', function(e) {
        searchQuery = e.target.value.trim();
        updateFilters();
      });

      fetch('recursos.json')
        .then(function(res) {
          if (!res.ok) throw new Error('HTTP ' + res.status);
          return res.json();
        })
        .then(function(data) {
          allRecursos = data.recursos || [];
          buildFilterButtons(allRecursos);
          render(allRecursos);
        })
        .catch(function(err) {
          console.warn('Error al cargar recursos.json:', err);
          render([]);
        });

      // Sincronizar tema
      var btn = document.getElementById('theme-toggle');
      if (btn && window.LuisLabTheme) {
        function syncTheme() {
          var dark = window.LuisLabTheme.get().resolved === 'dark';
          btn.querySelector('.icon-sun').style.display = dark ? 'none' : 'block';
          btn.querySelector('.icon-moon').style.display = dark ? 'block' : 'none';
        }
        btn.addEventListener('click', function() {
          window.LuisLabTheme.toggle();
          syncTheme();
        });
        syncTheme();
      }
    })();
  </script>
</body>
</html>
